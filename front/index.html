<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API do Portfólio - Lord Neco</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            background: #2d2d2d;
            padding: 30px;
            border-radius: 10px;
        }
        h1 {
            color: #667eea;
        }
        .url {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 18px;
        }
        code {
            background: #1a1a1a;
            padding: 5px 10px;
            border-radius: 5px;
            color: #4CAF50;
        }
        .btn-projetos {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        .btn-projetos:hover {
            background: #764ba2;
        }
        .btn-admin {
            background: #ff9800;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            margin-top: 25px;
            width: 100%;
            transition: background 0.3s;
        }
        .btn-admin:hover {
            background: #e68900;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #888;
        }
        hr {
            border-color: #444;
            margin: 25px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 API do Portfólio</h1>
        <p>Lord Neco</p>
        
        <h2>📋 Como listar os projetos</h2>
        <p>Adicione <code>/projetos</code> no final da URL:</p>
        
        <div class="url">
            <strong>Exemplo:</strong><br>
            <code>https://seu-backend.onrender.com/projetos</code>
        </div>
        
        <button class="btn-projetos" onclick="window.location.href='/projetos'">
            📋 Ver Projetos Agora
        </button>
        
        <hr>
        
        <button class="btn-admin" onclick="window.location.href='/login'">
            🔐 ÁREA ADMINISTRATIVA
        </button>
        
        <div class="footer">
            <p>© 2026 - API do Portfólio</p>
        </div>
    </div>
</body>
</html>
