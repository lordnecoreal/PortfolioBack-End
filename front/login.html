<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Painel Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            margin: 20px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .info {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }

        .lock-icon {
            font-size: 50px;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="lock-icon">🔒</div>
        <div class="login-header">
            <h1>Painel Administrativo</h1>
            <p>Portfólio - Lord Neco</p>
        </div>
        
        <div id="errorMessage" class="error-message"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label>👤 Usuário</label>
                <input type="text" id="usuario" required placeholder="Digite seu usuário">
            </div>
            
            <div class="form-group">
                <label>🔑 Senha</label>
                <input type="password" id="senha" required placeholder="Digite sua senha">
            </div>
            
            <button type="submit">Entrar no Painel</button>
        </form>
        
        <div class="info">
            <p>⚠️ Acesso restrito - Somente administrador</p>
        </div>
    </div>

    <script>
        // CONFIGURAÇÕES DE ACESSO - ALTERE AQUI!!!
        const ADMIN_USER = 'lordneco';      // Usuário para login
        const ADMIN_PASSWORD = 'LordNeco2026';  // Senha para login
        
        // Verificar se já está logado
        if (sessionStorage.getItem('admin_logado') === 'true') {
            window.location.href = '/admin';
        }
        
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const usuario = document.getElementById('usuario').value;
            const senha = document.getElementById('senha').value;
            
            if (usuario === ADMIN_USER && senha === ADMIN_PASSWORD) {
                // Login bem-sucedido
                sessionStorage.setItem('admin_logado', 'true');
                sessionStorage.setItem('admin_usuario', usuario);
                window.location.href = '/admin';
            } else {
                // Login falhou
                const errorDiv = document.getElementById('errorMessage');
                errorDiv.textContent = '❌ Usuário ou senha incorretos. Tente novamente.';
                errorDiv.style.display = 'block';
                
                // Limpar senha
                document.getElementById('senha').value = '';
                
                // Esconder mensagem após 3 segundos
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 3000);
            }
        });
    </script>
</body>
</html>
